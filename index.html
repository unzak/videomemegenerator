<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Meme Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <h1>Video Meme Generator</h1>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>1 · Texto</h2>
        <div class="field">
          <label for="text">
            Rótulo
            <span class="muted small">· lo que envuelvas en *asteriscos* sale resaltado</span>
          </label>
          <textarea id="text" rows="3" placeholder="Escribe aquí el texto del meme"></textarea>
        </div>

        <div class="field">
          <label for="size">
            Tamaño de letra
            <span class="muted small">· <span id="size-value">52</span> px</span>
          </label>
          <input type="range" id="size" min="26" max="76" step="0.01" value="52.28" />
        </div>

        <h2>2 · Vídeo</h2>
        <div class="field">
          <input type="file" id="file" accept="video/*" hidden />
          <button type="button" id="pick" class="btn-secondary wide">Elegir vídeo…</button>
          <p class="muted small" id="file-name">Ningún archivo seleccionado</p>
        </div>

        <div class="field">
          <label for="zoom">
            Tamaño del vídeo
            <span class="muted small">· <span id="zoom-value">100</span> %</span>
          </label>
          <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" />
        </div>

        <div class="field">
          <label for="bottom">
            Margen inferior
            <span class="muted small">· <span id="bottom-value">automático</span> · opcional</span>
          </label>
          <input type="range" id="bottom" min="0" max="1" step="0.001" value="0" />
        </div>

        <details class="section">
          <summary>3 · Colores</summary>
          <div class="colors">
            <div class="field">
              <label for="color-text">Texto</label>
              <input type="color" id="color-text" value="#ffffff" />
              <div class="swatches" data-for="color-text"></div>
            </div>
            <div class="field">
              <label for="color-highlight">Resaltado</label>
              <input type="color" id="color-highlight" value="#e9397e" />
              <div class="swatches" data-for="color-highlight"></div>
            </div>
          </div>
        </details>

        <button type="button" id="generate" class="btn">GENERA</button>
        <div class="progress" id="progress" hidden><div id="progress-bar"></div></div>
        <p class="status" id="status"></p>
      </section>

      <section class="panel" id="preview-panel">
        <h2>Vista previa</h2>
        <div class="stage">
          <canvas id="preview"></canvas>
          <button type="button" id="flip" class="stage-btn" aria-pressed="false"
                  title="Voltear en horizontal" aria-label="Voltear en horizontal">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v18" stroke-dasharray="3 3" />
              <path d="M8.5 8 4.5 12l4 4" />
              <path d="M15.5 8l4 4-4 4" />
            </svg>
          </button>
        </div>

        <div class="scrub">
          <button type="button" id="play" class="icon-btn" aria-pressed="false" disabled
                  title="Reproducir la previa" aria-label="Reproducir la previa">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path class="i-play" d="M8 5v14l11-7z" />
              <path class="i-pause" d="M7 5h3.4v14H7zm6.6 0H17v14h-3.4z" />
            </svg>
          </button>
          <input type="range" id="seek" min="0" max="1" step="0.001" value="0" disabled
                 aria-label="Fotograma de la previa" />
          <span class="muted small" id="seek-value">0:00 / 0:00</span>
        </div>

        <div class="trim" id="trim" hidden>
          <span class="icon-btn is-static" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="18" r="2.5" />
              <circle cx="6" cy="6" r="2.5" />
              <path d="M8.2 7.7 19.5 18.5M19.5 5.5 8.2 16.3" />
            </svg>
          </span>
          <div class="trim-track" id="trim-track">
            <div class="trim-span" id="trim-span"></div>
            <div class="trim-handle" id="trim-in" tabindex="0" role="slider"
                 aria-label="Inicio del recorte"></div>
            <div class="trim-handle" id="trim-out" tabindex="0" role="slider"
                 aria-label="Final del recorte"></div>
          </div>
          <span class="muted small" id="trim-value">0:00 – 0:00</span>
        </div>

        <p class="muted small" id="preview-info"></p>
      </section>
    </main>

    <section class="output" id="output" hidden>
      <h2>Resultado</h2>
      <div class="review" id="review" hidden>
        <div class="review-head">
          <p id="review-title"></p>
          <a class="lt" href="https://languagetool.org" target="_blank" rel="noopener"
            >LanguageTool</a
          >
        </div>
        <ul id="review-list" hidden></ul>
        <div class="review-fix" id="review-fix" hidden>
          <p id="review-proposal"></p>
          <button type="button" id="fix" class="btn-secondary">CORREGIR</button>
        </div>
      </div>

      <video id="result" controls playsinline></video>
      <p class="muted small" id="result-info"></p>
      <button type="button" id="download" class="btn">Descargar MP4</button>
    </section>

    <div id="drop" class="drop" hidden><p>Suelta el vídeo</p></div>

    <video id="source" hidden playsinline muted preload="auto"></video>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
